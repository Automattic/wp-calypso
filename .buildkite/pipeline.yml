steps:
  - label: ":desktop_computer: Build desktop (mac, unsigned)"
    agents:
      queue: mac
    plugins:
      - automattic/nvm#0.6.0
    env:
      CONFIG_ENV: release
      PLAYWRIGHT_SKIP_DOWNLOAD: 'true'
      SKIP_TSC: 'true'
      IMAGE_ID: xcode-26.4.1
      # Skip Corepack's Yarn download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      ELECTRON_BUILDER_ARGS: '-c.mac.target=dir'
      # Force electron-builder to copy files instead of hard-linking; avoids
      # EEXIST cleanup errors when packaging the .app on the BK mac agent.
      USE_HARD_LINKS: 'false'
    command: |
      set -euo pipefail

      # Diagnostic: confirm pipeline-level `env:` vars actually reach the shell.
      # Remove once the EEXIST hard-link issue is resolved.
      echo "--- env propagation check ---"
      env | sort | grep -E '^(CI|CONFIG_ENV|USE_HARD_LINKS|ELECTRON_BUILDER_ARGS|IMAGE_ID|COREPACK|PLAYWRIGHT_SKIP_DOWNLOAD|SKIP_TSC)=' || echo "(none of the expected vars are exported)"

      cd desktop
      corepack enable
      yarn install --immutable --inline-builds
      yarn run ci:build-mac
    artifact_paths:
      - desktop/release/**/*

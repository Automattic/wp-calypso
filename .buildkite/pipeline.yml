steps:
  - label: ":desktop_computer: Desktop yarn install"
    agents:
      queue: mac
    plugins:
      - automattic/nvm#0.6.0
    env:
      CONFIG_ENV: release
      PLAYWRIGHT_SKIP_DOWNLOAD: 'true'
      SKIP_TSC: 'true'
      IMAGE_ID: xcode-26.4.1
    command: |
      set -eu

      cd desktop
      yarn install --immutable --inline-builds

steps:
  - label: ":desktop_computer: Build desktop (mac)"
    agents:
      queue: mac
    plugins:
      - automattic/nvm#0.6.0
    env:
      IMAGE_ID: xcode-26.4.1
    command: .buildkite/commands/build-desktop-mac.sh
    artifact_paths:
      - desktop/release/*

  - label: ":mag: Diagnose signing chain"
    agents:
      queue: mac
    env:
      IMAGE_ID: xcode-26.4.1
    command: .buildkite/commands/diagnose-signing-chain.sh
    soft_fail: true

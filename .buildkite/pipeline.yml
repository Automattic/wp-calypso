steps:
  - label: ":desktop_computer: Build desktop (mac, unsigned)"
    agents:
      queue: mac
    plugins:
      - automattic/nvm#0.6.0
    env:
      IMAGE_ID: xcode-26.4.1
      CONFIG_ENV: release
      PLAYWRIGHT_SKIP_DOWNLOAD: 'true'
      SKIP_TSC: 'true'
      # Skip Corepack's Yarn download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      ELECTRON_BUILDER_ARGS: '-c.mac.target=dir'
      # Force electron-builder to copy files instead of hard-linking; avoids
      # EEXIST cleanup errors when packaging the .app on the BK mac agent.
      USE_HARD_LINKS: 'false'
    command: .buildkite/commands/build-desktop-mac.sh
    artifact_paths:
      - desktop/release/*

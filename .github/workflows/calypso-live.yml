name: Calypso Live

on:
  pull_request:
    types: ['opened']

jobs:
  calypso-live:
    name: 'Links to a calypso.live instance for your branch'
    runs-on: ubuntu-latest
    # We only offer the Calypso.live link to PRs created from the Automattic organization.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    timeout-minutes: 10
    steps:
      - name: Check if comment exists
        id: has_comment
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          result-encoding: string
          script: |
            const comments = await github.rest.issues.listComments( {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            } );
            // For debugging, if needed!
            console.log( comments );
            const existingComment = comments.data.find( comment => comment.body.includes( "calypso-live-watermark:apr@v1" ) );
            const hasComment = existingComment ? "true" : "false";
            console.log( `Has existing comment: ${ hasComment }` );
            return hasComment;
      - name: Post comment on PR
        uses: actions/github-script@v6
        if: steps.has_comment.outputs.result == 'false'
        with:
          # Skip adding a comment if we already have one.
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            // The Docker image build replaces this comment with the links once
            // it has an image (see `linksBlock` in
            // .teamcity/_self/projects/WebApp.kt). Link here only when that
            // build has already passed for this commit, e.g. for a PR opened
            // some time after the push. Links posted before the image existed
            // answered "not found", and kept doing so after the build.
            const sha = context.payload.pull_request.head.sha;
            const { data: status } = await github.rest.repos.getCombinedStatusForRef( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            } );
            const imageIsBuilt = status.statuses.some(
              ( { context: name, state } ) => name === 'Docker image (Web app)' && state === 'success'
            );

            const link = `https://calypso.live?image=registry.a8c.com/calypso/app:commit-${ sha }`;
            const readerLink = `https://calypso.live/reader?image=registry.a8c.com/calypso/app:commit-${ sha }`;
            const environments = [
              { label: 'WordPress.com Dashboard', url: `${link}&env=dashboard` },
              { label: 'WordPress.com (/reader)', url: readerLink },
              { label: 'Automattic for Agencies Dashboard', url: `${link}&env=dashboard-a4a` },
              { label: 'Automattic for Agencies', url: `${link}&env=a8c-for-agencies` },
              { label: 'Jetpack Cloud', url: `${link}&env=jetpack` },
            ];

            const body = [
              '<!--calypso-live-watermark:apr@v1-->',
              '<h2>🧐 Test on Calypso Live ⛅</h2>',
              '',
              ...( imageIsBuilt
                ? [
                    '| Environment | 🔗 |',
                    '| - | - |',
                    ...environments.map( env => `| ${ env.label } | [live link](${ env.url }) |` ),
                  ]
                : [
                    'Calypso Live links are being generated...',
                    'They will replace this message when the `Docker image (Web app)` check finishes, usually within a few minutes.',
                  ] ),
            ].join( '\n' );

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

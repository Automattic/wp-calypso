name: Is Calypso Channel Green?
run-name: ${{ github.actor }} Checking Calypso Slack Channel Status

on:
  merge_group:
  pull_request:
    # Include labeled/unlabeled so adding or removing "Ignore Red Slack"
    # re-triggers the check with the current label set.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-channel-status:
    runs-on: ubuntu-latest
    steps:
      - name: Should this check be bypassed?
        id: bypass
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SECRET_SET: ${{ secrets.CALYPSO_CHANNEL_STATUS_API_SECRET != '' }}
        run: |
          set -euo pipefail

          # A PR bypasses the red-channel gate if it is a revert or is
          # explicitly labelled "Ignore Red Slack". Title and labels are read
          # live via `gh pr view` (not the event payload) so re-running the
          # check picks up a label added after the run was first triggered.
          is_revert_or_labeled() {
            local pr="$1" data title labels
            data=$(gh pr view "$pr" --json title,labels)
            title=$(printf '%s' "$data" | jq -r '.title')
            labels=$(printf '%s' "$data" | jq -c '[.labels[].name]')
            echo "PR #$pr: $title (labels: $labels)"
            case "$title" in
              "Revert "*) return 0 ;;
            esac
            printf '%s' "$labels" | jq -e 'any(.[]?; . == "Ignore Red Slack")' >/dev/null 2>&1
          }

          bypass=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if is_revert_or_labeled "$PR_NUMBER"; then
              bypass=true
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # The merge-queue ref looks like
            # refs/heads/gh-readonly-queue/trunk/pr-123-<sha>, so pull the
            # merged PR number(s) out of it and inspect each one. Only bypass
            # when every PR in the group qualifies.
            pr_numbers=$(printf '%s' "$MERGE_HEAD_REF" | grep -oE 'pr-[0-9]+' | grep -oE '[0-9]+' || true)
            if [ -n "$pr_numbers" ]; then
              bypass=true
              for pr in $pr_numbers; do
                if ! is_revert_or_labeled "$pr"; then
                  bypass=false
                  break
                fi
              done
            fi
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SECRET_SET" != "true" ]; then
            echo "Channel status secret is unavailable (likely a fork PR); the merge queue still runs this check."
            bypass=true
          fi

          echo "Bypass channel check: $bypass"
          echo "bypass=$bypass" >> "$GITHUB_OUTPUT"

      - name: Pass for reverts, "Ignore Red Slack" PRs, and runs without the secret
        if: steps.bypass.outputs.bypass == 'true'
        run: echo "Skipping the red-channel gate."

      - name: Is the Calypso Slack channel green? (a failure here is not caused by this PR)
        if: steps.bypass.outputs.bypass != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The annotation is what people and agents see first on the checks
          # page, and the job summary is what they see when they open the run,
          # so both say that the gate failed and the change did not.
          report_failure() {
            local title="$1" reason="$2" retry_when="$3" next
            if [ "$EVENT_NAME" = "merge_group" ]; then
              next="Add the pull request to the merge queue again ${retry_when}. To merge anyway, add the \"Ignore Red Slack\" label to every pull request in the group first."
            else
              next="Re-run this check ${retry_when}. To merge anyway, add the \"Ignore Red Slack\" label, which re-runs this check and passes it."
            fi
            echo "::error title=${title}::${reason} There is nothing to fix in the code. ${next}"
            {
              echo "### ${title}"
              echo
              echo "${reason} **There is nothing to fix in the code.**"
              echo
              echo "${next}"
              echo
              echo 'Reverts (a title starting with `Revert `) skip this gate automatically.'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          STATUS=$(curl -s https://public-api.wordpress.com/wpcom/v2/calypso-slack-channel-status --header "Authorization: ${{ secrets.CALYPSO_CHANNEL_STATUS_API_SECRET }}" | xargs)
          if [ "$STATUS" = "GREEN" ]; then
            echo "Calypso Slack channel is green."
            exit 0
          elif [ "$STATUS" = "RED" ]; then
            echo "Calypso Slack channel is red."
            report_failure \
              "Not a problem with this change: the Calypso Slack channel is red" \
              "Merging to trunk is paused for every pull request while the Calypso Slack channel is red, and this check fails until then." \
              "once the channel is green"
            exit 1
          else
            echo "Calypso Slack channel status is unknown."
            report_failure \
              "Not a problem with this change: the Calypso Slack channel status is unknown" \
              "The channel status service did not answer GREEN or RED, so this check cannot tell whether merging is paused and fails to be safe." \
              "in a few minutes"
            exit 1
          fi
        shell: bash

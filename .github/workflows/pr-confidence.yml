name: PR Confidence

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Space-separated PR numbers; leave empty for all open PRs'
        required: false
        default: ''
      dry_run:
        description: 'Only write results to the job summary (always on when no PR numbers are given)'
        type: boolean
        default: true

concurrency:
  group: pr-confidence-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  score:
    if: |
      github.repository_owner == 'Automattic' && (
        github.event_name != 'pull_request' || (
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository (default branch only, never PR code)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322

      - name: Score PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run || inputs.pr_numbers == '') || format('{0}', vars.PR_CONFIDENCE_ENABLED != 'true') }}
          PR_NUMBERS: ${{ github.event.pull_request.number || inputs.pr_numbers }}
        run: |
          read -ra PRS <<<"$PR_NUMBERS"
          .github/scripts/pr-confidence/run.sh "${PRS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

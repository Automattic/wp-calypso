# Note: a pull request that changes this file or the Renovate config runs Renovate as a full dry
# run, without saving its cache, so a new version or setting can be checked in the log before it
# acts on the repository.

name: Renovate
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        type: choice
        default: debug
        options:
          - debug
          - trace
      dryRun:
        description: 'Dry run?'
        type: choice
        default: 'no'
        options:
          - 'no'
          - full
          - lookup
          - extract
      repoCache:
        description: 'Reset or disable the cache?'
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
  schedule:
    # Run every 30 minutes:
    - cron: '0,30 * * * *'
  pull_request:
    paths:
      - '.github/workflows/renovate.yml'
      - '.github/renovate-global.json5'
      - 'renovate.json5'
      - 'renovate.json'

# Renovate itself authenticates with RENOVATE_TOKEN; this token only restores its cache.
permissions:
  actions: read
  contents: read

concurrency:
  group: renovate-${{ github.ref }}

env:
  RENOVATE_VERSION: 44.239.1
  cache_archive: renovate_cache.tar.gz
  # This is the dir renovate provides -- if we set our own, we run into permissions issues.
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: gandalfs-renovate-cache

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # The dry run reads the repository config from trunk, so check this pull request's copy here.
      - name: Validate the Renovate config
        if: github.event_name == 'pull_request'
        run: |
          validate() {
            docker run --rm -v "$PWD:/repo" -w /repo --entrypoint renovate-config-validator \
              "ghcr.io/renovatebot/renovate:${RENOVATE_VERSION}" --strict "$@"
          }
          validate --no-global renovate.json5
          validate .github/renovate-global.json5

      - uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        if: github.event.inputs.repoCache != 'disabled'
        continue-on-error: true
        with:
          name: ${{ env.cache_key }}
          path: cache-download
          # Pull request runs don't upload a cache, so look past them for the latest one.
          search_artifacts: true

      - name: Extract renovate cache
        run: |
          set -x
          # Skip if no cache is set, such as the first time it runs.
          if [ ! -d cache-download ] ; then
            echo "No cache found."
            exit 0
          fi

          # Handle nested archive issue:
          mv "cache-download/$cache_archive" $cache_archive

          # Make sure the directory exists, and extract it:
          mkdir -p $cache_dir
          tar -xzf $cache_archive -C $cache_dir
          rm $cache_archive

          # Unfortunately, the permissions expected within renovate's docker container
          # are different than the ones given after the cache is restored. We have to
          # change ownership to solve this.
          RENOVATE_UID=$(docker run --rm --entrypoint id ghcr.io/renovatebot/renovate:${RENOVATE_VERSION} -u)  
          sudo chown -R $RENOVATE_UID:root /tmp/renovate/
          ls -R $cache_dir

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate-global.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'debug' }}
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' || github.event.inputs.dryRun == 'no' && 'null' || github.event.inputs.dryRun || 'null' }}
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}

      # If we don't compress it, the upload takes 100x longer. (Not a joke!)
      - name: Compress renovate cache
        if: github.event_name != 'pull_request' && github.event.inputs.repoCache != 'disabled'
        run: |
          ls $cache_dir
          # The -C is important -- otherwise we end up extracting the files with
          # their full path, ultimately leading to a nested directory situation.
          # To solve *that*, we'd have to extract to root (/), which isn't safe.
          tar -czvf $cache_archive -C $cache_dir .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.event.inputs.repoCache != 'disabled'
        with:
          name: ${{ env.cache_key }}
          path: ${{ env.cache_archive }}
          # Since this is created frequently, we don't need to keep it for long.
          retention-days: 1

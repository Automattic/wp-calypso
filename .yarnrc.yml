### Basic Yarn settings. ###
compressionLevel: 0
nodeLinker: node-modules
enableGlobalCache: true
yarnPath: .yarn/releases/yarn-4.0.2.cjs

### Log filters to discard irrelevant warnings. ###
logFilters:
  # WordPress packages often have transitive dependencies with incorrect react-related peer dependencies.
  # This matcher discards those log messages, while allowing non-react or non-wordpress related violations
  # to be handled separately. (For example, npm packages can be handled via packageExtensions.)
  #
  # WordPress will need to update/change the following packages to versions which include current React support,
  # and then we'll need to update to those WordPress package versions before we can remove this.
  # - react-autosize-textarea@npm:7.1.0
  #
  # The matcher works like so:
  # 1. Match any workspace package, such as @automattic/global-styles@workspace, calypso@workspace, happy-blocks@workspace
  # 2. Match any path within the workspace, such as @workspace:packages/page-pattern-modal [cd6b3], @workspace:client, or @workspace:.
  # 3. Match a react or react-dom on the supported versions which a workspace package provides.
  # 4. Match only violations coming from within @wordpress packages.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version +(18.3.1|19.*), which doesn't satisfy what +(@wordpress/*|@types/wordpress__*) and other dependencies request*"
  # These packages are used by packages that support React 19, but their published peer ranges haven't
  # been widened yet. Keep this scoped to React 19 and the exact packages reported by Yarn.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version 19.*, which doesn't satisfy what @paypal/react-paypal-js *"

  # i18n-calypso still declares a React 18 peer range.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version 19.*, which doesn't satisfy what i18n-calypso *"
  # Some peer groups mix a package that caps React at 18 (@wordpress/edit-post) with packages that
  # need 19, so no single version satisfies them. The group already fails on trunk; it's only reported
  # when Yarn happens to name a member outside the @wordpress matcher above, and which member it names
  # varies between environments. Drop this once that package widens its range.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version 19.*, which doesn't satisfy what +(@automattic/*|@testing-library/react) *"
  # @wordpress/stylelint-config needs @wordpress/theme 2, but the root resolutions pin theme to 1.0.0 for the app,
  # and theme 1.0.0 declares a Stylelint 16 peer. Its Stylelint plugins still load on 17, and their rules are
  # turned off in .stylelintrc. Remove this once the app moves to @wordpress/theme 2.
  - level: discard
    pattern: "stylelint is listed by your project with version 17.*, which doesn't satisfy what @wordpress/stylelint-config *"
  # Some plugins don't list ESLint 10 as a peer yet, and Yarn names whichever one it meets first. The repo
  # config wraps the ones that call removed APIs. Remove this once they widen their ranges.
  - level: discard
    pattern: "eslint is listed by your project with version 10.*, which doesn't satisfy what +(eslint-plugin-import|eslint-plugin-jsx-a11y|eslint-plugin-react) *"
  # babel-jest's babel-preset-current-node-syntax depends on old @babel/plugin-syntax-* packages that only list
  # Babel 7 as a peer. They only turn on syntax Babel 8 already parses, and they load fine on 8. Remove this once
  # babel-preset-current-node-syntax drops them or they widen their ranges.
  - level: discard
    pattern: "@babel/core is listed by your project with version 8.*, which doesn't satisfy what babel-jest *"

### Basic Yarn settings. ###
compressionLevel: 0
nodeLinker: node-modules
enableGlobalCache: true
# Don't add @types/* packages on `yarn add`. Yarn turns this on for any workspace with a tsconfig.json.
tsEnableAutoTypes: false
yarnPath: .yarn/releases/yarn-4.18.1.cjs

### Install scripts. ###
# Dependencies don't run install scripts unless `dependenciesMeta` in the root package.json allows them,
# so a compromised release can't run code on install. Workspace scripts still run.
enableScripts: false

### Package sources. ###
# Versions published in the last day aren't resolved: malicious releases from hijacked maintainer accounts
# are usually pulled within hours. Versions already locked aren't affected, and our own scopes are exempt.
# When a needed version is newer, Yarn reports the range as "quarantined": run that one command with
# YARN_NPM_MINIMAL_AGE_GATE=0.
npmMinimalAgeGate: 1d
npmPreapprovedPackages:
  - '@automattic/*'
  - '@wordpress/*'

### Package extensions to fix incorrect dependency metadata. ###
packageExtensions:
  # The MCP Post Editor app only imports @modelcontextprotocol/ext-apps/app-with-deps, whose dist bundles
  # zod and the MCP SDK, so the zod 4 peer is never resolved at runtime. Declaring zod 4 in the workspace
  # instead would hoist it to the root node_modules and break packages that share zod 3 (ai-ui-renderer).
  # Scoped to 2.x so a major upgrade makes us check this again.
  "@modelcontextprotocol/ext-apps@^2.0.4":
    peerDependenciesMeta:
      zod:
        optional: true

### Log filters to discard irrelevant warnings. ###
logFilters:
  # These packages are used by packages that support React 19, but their published peer ranges haven't
  # been widened yet. Keep this scoped to React 19 and the exact packages reported by Yarn.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version 19.*, which doesn't satisfy what @paypal/react-paypal-js *"

  # Some peer groups mix packages that cap React at 18 (qrcode.react 3, react-day-picker 7, react-slider 2,
  # @automattic/social-previews 3.0) with packages that need 19, so no single version
  # satisfies them. Which member Yarn names varies between environments, so the names cover every kind of
  # package in the group. Drop this once those are on releases that accept React 19.
  - level: discard
    pattern: "+(react|react-dom) is listed by your project with version 19.*, which doesn't satisfy what +(@automattic/*|@testing-library/react|@wordpress/*|@types/wordpress__*|react-intersection-observer) *"
  # Some plugins don't list ESLint 10 as a peer yet, and Yarn names whichever one it meets first. The repo
  # config wraps the ones that call removed APIs. Remove this once they widen their ranges.
  - level: discard
    pattern: "eslint is listed by your project with version 10.*, which doesn't satisfy what +(eslint-plugin-import|eslint-plugin-jsx-a11y|eslint-plugin-react) *"
